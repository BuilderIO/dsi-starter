<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSI Lite — Preview</title>
    <link rel="stylesheet" href="./theme.css" />
    <script>
      (function () {
        var t = localStorage.getItem("dsi-preview-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="search">
        <input id="search" type="search" placeholder="Filter previews…" autocomplete="off" />
      </div>

      <nav id="nav" class="nav" aria-label="Previews"></nav>

      <div class="sidebar-footer">
        <span id="count" class="count"></span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="current-title">Select a preview</h1>
          <code id="current-path" class="path"></code>
        </div>
        <div class="topbar-right">
          <button id="theme-toggle" class="btn-ghost" type="button" title="Toggle theme" aria-label="Toggle theme">
            <span data-theme-icon="light">☀</span>
            <span data-theme-icon="dark">☾</span>
            <span data-theme-icon="auto">◐</span>
          </button>
        </div>
      </header>

      <section id="stage" class="stage">
        <div id="empty" class="empty">
          <div class="empty-card">
            <div class="empty-spinner" aria-hidden="true"></div>
            <h2>Builder is generating your design system</h2>
            <p>
              Tokens, components, and previews will appear here as soon as Builder finishes
              writing them.
            </p>
          </div>
        </div>

        <div id="frames" class="frames" hidden></div>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
